name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the running one irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_VERSION: "22"

jobs:
  # --------------------------------------------------------------------------
  # Types, lint, and a production build. The cheapest signal, so it runs alone
  # rather than behind the database jobs.
  # --------------------------------------------------------------------------
  quality:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the changelog-convention check needs a merge base with
      # the target branch, which a shallow clone does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # eslint.config.mjs ignores public/sw.js and it is not TypeScript, so
      # nothing else here would notice a service worker that does not parse.
      # A duplicate `let` from a merge once shipped a worker that never
      # installed, and only the end-to-end job caught it, eight minutes in.
      # Parsed as a classic script, which is what the browser registers it as.
      - name: Check the service worker parses
        run: npm run lint:sw

      - name: Check the pending changelog entries
        run: npm run changelog:check

      # Entries belong in CHANGELOG.d/. Saying so in four guidance files did
      # not work: of the five pull requests opened in the hour after that
      # convention shipped, five edited CHANGELOG.md and none added a
      # fragment — four of them from branches that carried the instruction.
      - name: Check nothing edited CHANGELOG.md by hand
        if: github.event_name == 'pull_request'
        run: node scripts/check-changelog-edit.mjs "${{ github.event.pull_request.base.sha }}"

      - name: Build
        # next.config.ts sets eslint.ignoreDuringBuilds, so the lint step above
        # is the only thing standing between a lint error and main.
        env:
          # Prisma needs the variable to exist at build time. Nothing connects.
          DATABASE_URL: mysql://build:build@127.0.0.1:3306/build
        run: npm run build

  # --------------------------------------------------------------------------
  # Unit + integration. The integration suites skip themselves without a
  # database, so the run is checked afterwards for having actually happened.
  # --------------------------------------------------------------------------
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: personalcrm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      # The name must end in _test: tests/integration/db.ts refuses to truncate
      # anything else.
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/personalcrm_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate

      - name: Create the test schema
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Run tests
        run: npx vitest run --reporter=default --reporter=json --outputFile=vitest-results.json

      - name: Assert the integration suites actually ran
        if: always()
        run: node .github/scripts/assert-integration-ran.mjs vitest-results.json

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: vitest-results.json
          retention-days: 7

  # --------------------------------------------------------------------------
  # End-to-end, against the standalone bundle the container actually ships —
  # not `next dev` — on a database that starts empty so first-run setup runs.
  # --------------------------------------------------------------------------
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: personalcrm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/personalcrm
      APP_URL: http://127.0.0.1:3200
      E2E_BASE_URL: http://127.0.0.1:3200
      # Only ever used by this throwaway instance.
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      DISABLE_SIGNUP: "false"
      TZ: America/New_York

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Assemble the standalone bundle
        # `output: "standalone"` traces only the modules the server needs;
        # static assets and public/ are copied in separately, exactly as the
        # Dockerfile does it.
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the app
        run: |
          PORT=3200 HOSTNAME=127.0.0.1 node .next/standalone/server.js > server.log 2>&1 &
          echo $! > server.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3200/api/health > /dev/null; then
              echo "up after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "the app never became healthy" >&2
          cat server.log >&2
          exit 1

      - name: Run Playwright
        run: npx playwright test

      - name: Stop the app
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            server.log
          retention-days: 7

  # --------------------------------------------------------------------------
  # The container is the product, so building it is part of the build — and a
  # clean-volume boot is what has been verified by hand at the end of every
  # phase so far.
  # --------------------------------------------------------------------------
  image:
    name: Container build and boot
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: personalcrm:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot on an empty volume
        # Everything first-run does: generate secrets, initialise MariaDB under
        # /config/db, apply every migration, then serve.
        run: |
          mkdir -p "${RUNNER_TEMP}/config"
          docker run -d --name personalcrm-ci \
            -e PUID=1001 -e PGID=1001 \
            -e TZ=America/New_York \
            -e APP_URL=http://127.0.0.1:3000 \
            -v "${RUNNER_TEMP}/config:/config" \
            -p 3000:3000 \
            personalcrm:ci

          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/api/health | tee /dev/stderr | grep -q '"database":"up"'; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "the container never reported healthy" >&2
          docker logs personalcrm-ci >&2
          exit 1

      - name: Restart with the data still there
        # secrets.json and /config/db are reused rather than regenerated, which
        # is the whole reason an upgrade is just `docker pull`.
        run: |
          docker restart personalcrm-ci
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/api/health | grep -q '"database":"up"'; then
              echo "healthy again after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          docker logs personalcrm-ci >&2
          exit 1

      - name: Container logs
        if: always()
        run: docker logs personalcrm-ci 2>&1 | tail -100 || true

      - name: Clean up
        if: always()
        run: docker rm -f personalcrm-ci 2>/dev/null || true
